[project]
name = "connected-frontiers"
version = "0.0.1"
description = "A rank-guided crawler and cited reasoner over a knowledge graph of the frontier-AI ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.27",
  "protego>=0.3", # robots.txt
  "trafilatura>=1.9", # HTML -> main text
  "networkx>=3.2",
  "openai>=1.40", # OpenRouter speaks the OpenAI-compatible API
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
extract-baseline = ["gliner>=0.2"]                   # non-LLM extraction baseline (pulls torch)
resolve = ["rapidfuzz>=3"]
data = ["pandas>=2.2", "pyarrow>=15"]
release = ["datasets>=2.19", "huggingface_hub>=0.23"]
js = ["playwright>=1.44"]                            # JS-rendered pages, only if needed
dev = ["pytest>=8", "ruff>=0.5", "ipykernel>=6"]

[project.scripts]
cf = "cf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
