# Structured-source adapters (no LLM). Edges are graded 'verified' when the record is primary.
huggingface:
  enabled: true
  models_per_org: 12          # top by downloads
  datasets_per_org: 6
  auto_map: true              # also map AI-relevant KB orgs to Hub orgs (strict; ambiguous → review)
  exclude:                    # confirmed or suspected false matches (owner review)
    - Turing                  # KB: AI data company; Hub: turing-motors
    - Gray Swan               # Hub handle 'sureheremarv' needs a human check
  # seed name -> Hugging Face organisation. PROPOSED; owner to confirm.
  orgs:
    Mistral AI: mistralai
    Cohere: CohereLabs
    DeepSeek: deepseek-ai
    Ai2: allenai
    Meta AI: meta-llama
    Google DeepMind: google
    NVIDIA: nvidia
    OpenAI: openai
    xAI: xai-org
    AI21 Labs: ai21labs
    Hugging Face: HuggingFaceTB
    Thinking Machines Lab: thinkingmachines
    Anthropic: Anthropic          # two verified Hub orgs (Anthropic, Anthropic-ai): owner choice
