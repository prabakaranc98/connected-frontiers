# Pilot: validate the judges and the pipeline end to end before the main run (docs/AGENCY_EVAL.md §11, phase A).
name: agency_pilot
tasks: {personas: [undergrad_capstone, career_switcher, senior_research_engineer, forward_deployed], per_persona: 1, rich: 1, seed: 13}
models: [thinkingmachines/inkling-2-small]
conditions: [closed_book, kg_tools, kg_agentic]
judges: {models: [z-ai/glm-5.3, nvidia/nemotron-3.5-super-vl], roles: [persona, expert]}
validate_judges: true
unit_test_answers: 3
comparisons:
  - {name: "agentic vs memory", x: {model: thinkingmachines/inkling-2-small, condition: kg_agentic}, y: {model: thinkingmachines/inkling-2-small, condition: closed_book}}
  - {name: "agentic vs plain tools", x: {model: thinkingmachines/inkling-2-small, condition: kg_agentic}, y: {model: thinkingmachines/inkling-2-small, condition: kg_tools}}
workers: 6
