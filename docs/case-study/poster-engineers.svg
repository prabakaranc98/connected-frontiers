<text x="96" y="366" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">evaluation, design, engineering, product, sales.</text>
<text x="96" y="412" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">Figma —hires_for→ Researcher, AI Evaluations</text>
