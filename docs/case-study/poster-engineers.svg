<text x="60" y="1290" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">On 14 held-out sessions: 0.94 answer F1 with the graph, 0.10 from memory · Inkling-2-small · harness h3</text>
<text x="60" y="1314" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Findings are what the graph holds, not audited facts.   Explore: pracha.me/connected-frontiers   ·   Code: github.com/prabakaranc98/connected-frontiers</text>
