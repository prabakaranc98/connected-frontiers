<text x="96" y="616" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="start" letter-spacing="0.12em">RESEARCH ENGINEER · LEARN A METHOD FROM PRACTICE</text>
<text x="96" y="644" font-size="16.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">“What is fine-tuning related to, and which organisations use it in practice?”</text>
<text x="96" y="686" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">Four variants of fine-tuning in the graph, and</text>
<text x="96" y="716" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">14 organisations using it, each with a source.</text>
<text x="96" y="762" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">Notion —uses_method→ fine-tuning</text>
<rect x="386.8" y="747" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="422.0" y="763" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="784" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">fireworks.ai: “By partnering with Fireworks to fine-tune models, we reduced latency…”</text>
<text x="96" y="818" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">Thinking Machines Lab —uses_method→ fine-tuning</text>
<rect x="512.8" y="803" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="548.0" y="819" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="840" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">thinkingmachines.ai: “tools that enable everyone to fine-tune models” · missed: reinforcement fine-tuning</text>
<text x="96" y="876" font-size="15" font-weight="600" fill="#7C3AED" text-anchor="start">Why it matters: sourced variants and real users beat a survey as a reading list.</text>
