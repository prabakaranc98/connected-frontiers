<text x="60" y="128" font-size="38" font-weight="700" fill="#0F172A" text-anchor="start">Three engineering questions, answered from a graph</text>
<text x="60" y="164" font-size="17" font-weight="400" fill="#475569" text-anchor="start">A small open model (Inkling-2-small) walked the knowledge graph with tools and cited every edge it used.</text>
<text x="60" y="188" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Each edge keeps its source quote and an evidence status: claimed, confirmed, corroborated or verified.</text>
