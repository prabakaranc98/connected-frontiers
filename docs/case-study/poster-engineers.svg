<rect x="60" y="946" width="5" height="282" rx="2.5" fill="#2563EB"/>
<text x="96" y="966" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0.12em">FORWARD-DEPLOYED ENGINEER · KNOW THE CUSTOMER’S STACK</text>
<text x="96" y="994" font-size="16.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">“Who works on autonomous driving, and which methods and technologies do they rely on?”</text>
<text x="96" y="1036" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">Woven runs PyTorch with Hydra configs on</text>
<text x="96" y="1066" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">on-prem DGX plus AWS, tracked in W&amp;B.</text>
<text x="96" y="1112" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">Woven —uses_tech→ DGX, AWS EC2, SageMaker</text>
<rect x="462.40000000000003" y="1097" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="497.6" y="1113" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="1134" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">wandb.ai: “on-prem (DGX) … cloud (AWS EC2 and SageMaker) infrastructure”</text>
<text x="96" y="1168" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">Woven —uses_method→ autolabeling</text>
<rect x="386.8" y="1153" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="422.0" y="1169" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="1190" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">wandb.ai: “Autolabeling and dataset queries during the data curation workflow”</text>
<text x="96" y="1226" font-size="15" font-weight="600" fill="#2563EB" text-anchor="start">Why it matters: knowing a customer’s tools, data workflow and infrastructure split before day one.</text>
