<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>What a small model found by walking the graph: three case studies from Connected Frontiers</title>
<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.07"/></filter></defs>
<rect width="1080" height="1350" fill="#F8FAFC"/>
<text x="60" y="78" font-size="14" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0.14em">CASE STUDY · CONNECTED FRONTIERS</text>
<text x="60" y="128" font-size="40" font-weight="700" fill="#0F172A" text-anchor="start">What a small model found by walking the graph</text>
<text x="60" y="164" font-size="17" font-weight="400" fill="#475569" text-anchor="start">Inkling-2-small answered multi-turn questions with graph tools. Every answer cites the edges it used;</text>
<text x="60" y="188" font-size="17" font-weight="400" fill="#475569" text-anchor="start">each edge keeps its source quote and an evidence status: claimed, confirmed, corroborated or verified.</text>
<rect x="60" y="222" width="960" height="330" rx="18" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#sh)"/>
<rect x="60" y="246" width="5" height="282" rx="2.5" fill="#2563EB"/>
<text x="96" y="266" font-size="13" font-weight="700" fill="#2563EB" text-anchor="start" letter-spacing="0.12em">INVESTOR VIEW · TRACTION CLAIMS</text>
<text x="96" y="294" font-size="16.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">“Which customers does OpenRouter say it serves, and how well is each claim evidenced?”</text>
<text x="96" y="336" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">All 12 customer claims come from OpenRouter’s own site,</text>
<text x="96" y="366" font-size="24" font-weight="700" fill="#0F172A" text-anchor="start">and 8 of the 12 rest on nothing more than a logo.</text>
<text x="96" y="412" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">OpenRouter —serves→ Prime Intellect</text>
<rect x="412.0" y="397" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="447.2" y="413" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="434" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">openrouter.ai: “grew 100x on OpenRouter and cut its cost per token by 60%”</text>
<text x="96" y="468" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="start">OpenRouter —serves→ Lovable</text>
<rect x="344.8" y="453" width="70.4" height="22" rx="11" fill="#EA580C" fill-opacity="0.12"/>
<text x="380.0" y="469" font-size="12" font-weight="700" fill="#EA580C" text-anchor="middle">claimed</text>
<text x="96" y="490" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-style="italic">openrouter.ai: “Lovable logo” · also claimed by Baseten, Cerebras, Cloudflare, Fireworks AI</text>
<text x="96" y="526" font-size="15" font-weight="600" fill="#2563EB" text-anchor="start">Why it matters: a logo wall and a confirmed customer are different kinds of evidence.</text>
<rect x="800" y="404" width="24" height="24" rx="5" fill="#2563EB" fill-opacity="0.85" stroke="#2563EB" stroke-width="1.5"/>
<rect x="832" y="404" width="24" height="24" rx="5" fill="#2563EB" fill-opacity="0.85" stroke="#2563EB" stroke-width="1.5"/>
