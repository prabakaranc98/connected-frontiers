<text x="740" y="1174" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">MuZero</text>
<path d="M840 1108 L840 1156" stroke="#94A3B8" stroke-width="1.4" fill="none"/>
<rect x="796" y="1156" width="88" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="840" y="1174" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">AlphaZero</text>
<path d="M840 1108 L940 1156" stroke="#94A3B8" stroke-width="1.4" fill="none"/>
<rect x="896" y="1156" width="88" height="26" rx="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2"/>
<text x="940" y="1174" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">AlphaDev</text>
<text x="60" y="1290" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">On 14 held-out sessions: 0.94 answer F1 with the graph, 0.10 from memory · Inkling-2-small · harness h3</text>
<text x="60" y="1314" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Findings are what the graph holds, not audited facts.   Explore: pracha.me/connected-frontiers   ·   Code: github.com/prabakaranc98/connected-frontiers</text>
</svg>
